name: First publish (one-time)

# One-time bootstrap: npm trusted publishing can only be configured once the
# package exists. This workflow publishes the very first version with a
# short-lived granular token stored as the NPM_TOKEN repository secret
# (Settings > Secrets and variables > Actions). Environments are not
# available for private repositories on the free GitHub plan. After it succeeds: configure trusted publishing on npmjs.com,
# revoke the token, delete the secret, and delete this file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish the current package.json version to npm'
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Refuse to overwrite an existing version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published" >&2
            exit 1
          fi
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
