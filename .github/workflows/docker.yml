name: Docker image

# Builds the image for linux/amd64 and linux/arm64 and pushes it to the
# GitHub Container Registry, with build provenance:
#   - on a version tag (v1.2.3): tags 1.2.3, 1.2 and latest;
#   - every week: the latest release is rebuilt on a fresh base image, so
#     fixes of the base image reach the published tags;
#   - by hand (workflow_dispatch), for a given tag.
# Nothing is pushed from pull requests or from main.

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build (for example v0.13.0)
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - name: Find the tag to build
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          case "$EVENT" in
            push) ref="$GITHUB_REF_NAME" ;;
            workflow_dispatch) ref="$INPUT_REF" ;;
            *) ref="$(gh release view --repo "$REPO" --json tagName --jq .tagName)" ;;
          esac
          case "$ref" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Not a version tag: $ref" >&2; exit 1 ;; esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - name: The tag matches package.json
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$VERSION"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.ref }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Smoke test of the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          test "$(docker run --rm "$IMAGE" --version)" = "$VERSION"
          docker run --rm "$IMAGE" checks list | grep -q MAP-DSC01
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
